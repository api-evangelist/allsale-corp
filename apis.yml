name: ALLSALE Corp.
description: ALLSALE Corp. operates ALLSALE, a TikTok Shop growth and creator-marketing
  automation platform for consumer brands. It runs three AI agents — a Creator Discovery
  Agent that finds and engages relevant TikTok creators, a Budget Optimization Agent
  that recommends budget allocation and commission adjustments, and a Performance Analyst
  Agent that tracks GMV and predicts results — automating the full workflow from creator
  discovery and outreach through performance tracking and ROI analysis. The company
  is a 500 Global portfolio company and reports 100K+ creators engaged and $50M+ in
  customer revenue generated across its brand clients. Plans run from a $399/month
  Starter tier to a $599/month Pro tier, with custom Enterprise pricing offering unlimited
  messaging, multi-brand support, and white-label options.
